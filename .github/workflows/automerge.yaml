name: Automerge Dependabot PRs

on:
  workflow_dispatch:

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.12.0
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          semver-filter: minor,patch,major
          merge-method: merge
          update-branch-before-merge: "true"
